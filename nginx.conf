server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect con indirizzo relativo: mantiene la porta (8085) e il nome usati dal browser
    absolute_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript text/html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Giochi della repo: basta mettere un file .html in app/files/. La pagina legge l'elenco
    # dei file da qui (formato JSON), senza nessuna lista da aggiornare a mano.
    location /files/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    # Giochi caricati dalla pagina (volume condiviso con il servizio "giochi")
    location /caricati/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    # Caricamento, eliminazione e gruppi: inoltrati al servizio "giochi". Il nome viene risolto
    # a ogni richiesta, così nginx parte anche se quel servizio è fermo.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $giochi http://giochi:3000;
        proxy_pass $giochi;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 4m;
    }
}
